<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Beneficios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <div class="page-header">
        <h1>Beneficios</h1>
        <a class="button" th:href="@{/benefits/new}">Nuevo beneficio</a>
    </div>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <p class="empty" th:if="${#lists.isEmpty(benefits)}">Todavía no hay beneficios registrados.</p>

    <table th:unless="${#lists.isEmpty(benefits)}">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Descripción</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="benefit : ${benefits}">
            <td th:text="${benefit.name}">Nombre</td>
            <td><span class="badge" th:text="${benefit.type.label}">Tipo</span></td>
            <td th:text="${benefit.description} ?: '—'">Descripción</td>
            <td>
                <div class="actions">
                    <a class="button secondary" th:href="@{/benefits/{id}/edit(id=${benefit.id})}">Editar</a>
                    <form th:action="@{/benefits/{id}/delete(id=${benefit.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este beneficio?');">
                        <button type="submit" class="button danger">Eliminar</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
