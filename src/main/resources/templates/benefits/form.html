<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo beneficio</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <h1>Nuevo beneficio</h1>

    <form th:action="@{/benefits}" th:object="${benefitForm}" method="post" class="form">
        <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" th:field="*{name}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</p>
        </div>

        <div class="form-group">
            <label for="type">Tipo</label>
            <select id="type" th:field="*{type}">
                <option th:each="type : ${types}"
                        th:value="${type}"
                        th:text="${type.label}">Tipo</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Error</p>
        </div>

        <div class="form-group">
            <label for="description">Descripción</label>
            <textarea id="description" th:field="*{description}" rows="4"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</p>
        </div>

        <div class="form-actions">
            <button type="submit">Crear beneficio</button>
            <a class="button secondary" th:href="@{/benefits}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
