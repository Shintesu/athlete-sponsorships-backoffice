<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${athlete.fullName}">Detalle del atleta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="page-header">
        <h1 th:text="${athlete.fullName}">Nombre</h1>
        <div class="actions">
            <a class="button secondary" th:href="@{/athletes/{id}/edit(id=${athlete.id})}">Editar atleta</a>
            <a class="button" th:if="${athlete.status.name() == 'ACTIVE'}"
               th:href="@{/athletes/{id}/contracts/new(id=${athlete.id})}">Nuevo contrato</a>
        </div>
    </div>

    <dl class="detail">
        <dt>Disciplina</dt>
        <dd th:text="${athlete.discipline}">Disciplina</dd>
        <dt>País</dt>
        <dd th:text="${athlete.country}">País</dd>
        <dt>Estado</dt>
        <dd>
            <span class="badge" th:classappend="${athlete.status.name().toLowerCase()}"
                  th:text="${athlete.status.label}">Estado</span>
        </dd>
    </dl>

    <h2>Contratos</h2>
    <p class="empty" th:if="${#lists.isEmpty(contractViews)}">Este atleta todavía no tiene contratos.</p>
    <table th:unless="${#lists.isEmpty(contractViews)}">
        <thead>
        <tr>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Estado</th>
            <th>Beneficios</th>
            <th>Observaciones</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="view : ${contractViews}">
            <td th:text="${#temporals.format(view.contract.startDate, 'dd/MM/yyyy')}">Inicio</td>
            <td th:text="${#temporals.format(view.contract.endDate, 'dd/MM/yyyy')}">Fin</td>
            <td>
                <span class="badge" th:classappend="${view.status.name().toLowerCase()}"
                      th:text="${view.status.label}">Estado</span>
            </td>
            <td>
                <span th:if="${#lists.isEmpty(view.contract.benefits)}">—</span>
                <span th:each="benefit, iter : ${view.contract.benefits}">
                    <span th:text="${benefit.name}">Beneficio</span><span th:unless="${iter.last}">, </span>
                </span>
            </td>
            <td th:text="${view.contract.notes}">Observaciones</td>
            <td><a th:href="@{/contracts/{id}(id=${view.contract.id})}">Ver contrato</a></td>
        </tr>
        </tbody>
    </table>

    <p><a th:href="@{/athletes}">Volver a la lista</a></p>
</main>
</body>
</html>
