<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${athleteId != null ? 'Editar atleta' : 'Nuevo atleta'}">Atleta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <h1 th:text="${athleteId != null ? 'Editar atleta' : 'Nuevo atleta'}">Atleta</h1>

    <form th:action="@{${athleteId != null ? '/athletes/' + athleteId : '/athletes'}}"
          th:object="${athleteForm}" method="post" class="form">
        <div class="form-group">
            <label for="fullName">Nombre completo</label>
            <input type="text" id="fullName" th:field="*{fullName}" maxlength="150" required>
            <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Error</p>
        </div>

        <div class="form-group">
            <label for="discipline">Disciplina</label>
            <input type="text" id="discipline" th:field="*{discipline}" maxlength="100" required>
            <p class="field-error" th:if="${#fields.hasErrors('discipline')}" th:errors="*{discipline}">Error</p>
        </div>

        <div class="form-group">
            <label for="country">País</label>
            <input type="text" id="country" th:field="*{country}" maxlength="100" required>
            <p class="field-error" th:if="${#fields.hasErrors('country')}" th:errors="*{country}">Error</p>
        </div>

        <div class="form-group">
            <label for="status">Estado</label>
            <select id="status" th:field="*{status}" required>
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status.label}">Estado</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Error</p>
        </div>

        <div class="form-actions">
            <button type="submit" th:text="${athleteId != null ? 'Guardar cambios' : 'Crear atleta'}">Guardar</button>
            <a class="button secondary" th:href="@{/athletes}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
